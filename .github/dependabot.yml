# Dependabot: como mucho un PR por ecosistema por mes.
# - npm: minor y patch de todas las dependencias en un solo PR. Las major no se
#   proponen (se hacen a mano). @types/node sigue además a la Node mínima de
#   engines (scripts/check-types-node.mjs). Las actualizaciones de seguridad
#   llegan agrupadas en un solo PR.
# - GitHub Actions (fijadas por SHA, con la versión en el comentario): todas juntas.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencias:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      seguridad:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
