version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor y patch en un solo PR; las major llegan por separado.
      minor-y-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node sigue a la Node mínima de engines (scripts/check-types-node.mjs):
      # sus major se suben a mano junto con engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Actualiza los SHA de las actions fijadas (y el comentario con la versión).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
