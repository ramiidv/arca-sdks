name: WSDL de ARCA

# Verifica todas las noches que los WSDL publicados por ARCA sigan iguales a los
# snapshots de packages/*/wsdl/ (contra los que corren los tests de contrato).
# Si ARCA cambia un servicio, el job falla: correr `npm run wsdl:update`,
# revisar el diff y ajustar los schemas.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run wsdl:check
