name: WSDL de ARCA

# Verifica todas las noches que los WSDL publicados por ARCA sigan iguales a los
# snapshots de packages/*/wsdl/ (contra los que corren los tests de contrato).
# Si ARCA cambia un servicio, el job falla: correr `npm run wsdl:update`,
# revisar el diff y ajustar los schemas. En la corrida programada, si falla abre
# (o comenta) un issue.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run wsdl:check

  avisar:
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir o comentar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="WSDL de ARCA: un WSDL publicado cambió respecto del snapshot"
          numero=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          cuerpo="La verificación nocturna de los WSDL falló: $RUN_URL. Correr \`npm run wsdl:update\`, revisar el diff y ajustar los schemas (o, si fue un error de red, volver a correr el workflow)."
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --body "$cuerpo"
          fi
