name: Dependencias frescas

# Los paquetes publicados declaran rangos (ej. fast-xml-parser ^5.11.2): quien los
# instala resuelve la versión más nueva del rango ese día, sin el package-lock de
# este repo. Este workflow hace lo mismo una vez por mes (y a pedido): instala sin
# lockfile, con lo último de cada rango, y corre build, typecheck y tests. Si
# falla, abre (o comenta) un issue: una dependencia rompió algo antes de que
# Dependabot lo proponga.

on:
  schedule:
    - cron: "0 9 1 * *" # día 1 de cada mes, 9:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-frescas
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar sin lockfile (lo último de cada rango)
        run: |
          rm package-lock.json
          npm install --no-audit --no-fund --ignore-scripts
      - name: Versiones resueltas de las dependencias de runtime
        run: npm ls fast-xml-parser node-forge --all
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:smoke

  avisar:
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Abrir o comentar el issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Dependencias frescas: falla con las últimas versiones de los rangos"
          numero=$(gh issue list --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number')
          cuerpo="La corrida mensual sin lockfile falló: $RUN_URL. Alguna dependencia publicó una versión (dentro de los rangos que declaran los paquetes) que rompe el build o los tests. Los usuarios que instalen hoy la van a recibir."
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body "$cuerpo"
          else
            gh issue create --title "$titulo" --body "$cuerpo"
          fi
