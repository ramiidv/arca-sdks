name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing (OIDC): npm publica sin token y agrega provenance.
  id-token: write

jobs:
  # Mismos checks que un PR (tests en Node 20.19/22/24, lint, publint, api:check):
  # no se publica con CI en rojo.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted publishing requiere npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # Con changesets pendientes abre/actualiza el PR "chore: version packages";
      # si no hay, publica los paquetes cuya versión no está en npm.
      - uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
