name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Sin permisos por defecto: cada job declara solo los que necesita.
permissions: {}

# Flujo dividido con las sub-actions de changesets/action, para que solo el job
# que publica tenga id-token (trusted publishing):
#   select-mode -> "version": abre/actualiza el PR "chore: version packages".
#               -> "publish": hay versiones sin publicar -> pack (build sin
#                  privilegios) -> publish (aprobación manual del environment).
#               -> "none": no hace nada.
#
# Node 24.22 trae npm 11.19.1; trusted publishing requiere npm >= 11.5.1, así que
# no hace falta actualizar npm. Si se cambia node-version, mantener npm >= 11.5.1.

jobs:
  # Mismos checks que un PR (tests en Node 22/24, lint, publint, api:check):
  # no se versiona ni se publica con CI en rojo.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  select-mode:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  # Con changesets pendientes abre/actualiza el PR "chore: version packages".
  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push de la rama changeset-release/main
      pull-requests: write # abrir/actualizar el PR de versión
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  # Build y `npm pack` sin permisos de escritura ni id-token.
  pack:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  # Publica en npm los tarballs generados por `pack` (no vuelve a compilar) y
  # crea los tags y GitHub Releases.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El environment "npm-publish" se configura en Settings > Environments con
    # aprobación requerida y limitado a la rama main. Mientras no exista, GitHub
    # lo crea al vuelo sin reglas de protección. Conviene declararlo también en
    # el trusted publisher de cada paquete en npmjs.com.
    environment: npm-publish
    permissions:
      contents: write # tags y GitHub Releases
      id-token: write # trusted publishing (OIDC): sin token de npm, con provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
