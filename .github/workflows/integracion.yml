name: Integración (homologación)

# Corre los tests de tests/integration de cada paquete contra ARCA homologación.
# Secrets del repo:
#   ARCA_TEST_CERT, ARCA_TEST_KEY  certificado y clave de homologación (PEM)
#   ARCA_TEST_CUIT                 CUIT del certificado
# Variables del repo (opcionales):
#   ARCA_TEST_SERVICES  servicios en los que el certificado está autorizado, separados
#                       por comas (ej: wsfe,wscdc,ws_sr_padron_a100). Sin autorización
#                       solo corren los dummy.
#   ARCA_TEST_PTO_VTA   punto de venta de WSFE (default: 1)
# Sin los secrets, los tests se saltean.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: integracion
  cancel-in-progress: false

jobs:
  homologacion:
    runs-on: ubuntu-latest
    env:
      ARCA_TEST_CERT: ${{ secrets.ARCA_TEST_CERT }}
      ARCA_TEST_KEY: ${{ secrets.ARCA_TEST_KEY }}
      ARCA_TEST_CUIT: ${{ secrets.ARCA_TEST_CUIT }}
      ARCA_TEST_SERVICES: ${{ vars.ARCA_TEST_SERVICES }}
      ARCA_TEST_PTO_VTA: ${{ vars.ARCA_TEST_PTO_VTA }}
      ARCA_TEST_TICKETS_DIR: ${{ github.workspace }}/.arca-test-tickets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # WSAA no emite un ticket nuevo mientras el anterior siga vigente (hasta 12 h):
      # se restaura el último guardado y se guarda el de esta corrida.
      - uses: actions/cache@v4
        with:
          path: .arca-test-tickets
          key: arca-test-tickets-${{ github.run_id }}
          restore-keys: arca-test-tickets-
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration
